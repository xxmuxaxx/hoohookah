<section class="hero" id="top">
  <div class="container hero__inner">
    <div class="hero__content">
      <p class="eyebrow">Конструктор кальянов</p>
      <h1 class="hero__title">Соберите кальян <span class="accent">под себя</span></h1>
      <p class="hero__lead">
        Выберите шахту, колбу, чашу и шланг — превью обновляется на лету. Соберём, проверим на герметичность и привезём
        по Москве на следующий день.
      </p>
      <div class="hero__actions">
        <a class="button button--primary" href="#constructor">Собрать кальян</a>
        <a class="button button--ghost" href="#steps">Как это работает</a>
      </div>
      <dl class="hero__facts">
        <div class="fact">
          <dt class="fact__label">Цена</dt>
          <dd class="fact__value">от <span data-min-price>—</span></dd>
        </div>
        <div class="fact">
          <dt class="fact__label">Сочетаний</dt>
          <dd class="fact__value" data-combinations>—</dd>
        </div>
        <div class="fact">
          <dt class="fact__label">Гарантия</dt>
          <dd class="fact__value">1 год</dd>
        </div>
      </dl>
    </div>

    <div class="hero__visual" data-hero-hookah aria-hidden="true"></div>
  </div>
</section>
